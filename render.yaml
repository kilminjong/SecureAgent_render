services:
  - type: web
    name: secureagent
    env: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: secureagent-db
          property: connectionString

databases:
  - name: secureagent-db
    plan: free
